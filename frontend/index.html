<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" /> <!-- Changed to .ico as used in the component -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#D32F2F" />
    
    <!-- PWA / installable web app -->
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Apple PWA support (legacy; keep for older iOS) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="People_360 Attendance" />
    <link rel="apple-touch-icon" href="/BL.svg" />
    
    <!-- OPTIMIZATION: Pre-connect to Google Fonts servers to speed up font loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- CRITICAL: Preload fonts to prevent FOIT/FOUT layout shifts -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" as="style">
    
    <!-- Original Google Fonts link with display=swap to prevent text blocking -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- CRITICAL: Lock typography metrics to prevent reflow -->
    <style>
      /* Prevent font loading layout shifts */
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }
      
      /* Lock font metrics during load */
      * {
        -webkit-text-size-adjust: 100%;
        -moz-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      
      /* Prevent CLS from font loading */
      .profile-page {
        font-display: swap;
      }
    </style>
    
    <title>People_360 People</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
